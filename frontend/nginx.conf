server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Service worker scripts must never be long-cached: unlike Vite's
    # hashed bundle filenames, these keep a fixed name across deploys, so
    # an immutable 1y cache (from the generic rule below) can strip a
    # browser to a stale sw.js indefinitely and break PWA install/update.
    # Exact-match location wins over the regex rule below regardless of
    # declaration order, but this MUST be the origin fix — reverse proxies
    # in front of this container (nginx.conf/nginx.prod.conf) set their own
    # Cache-Control via add_header, which appends rather than replacing a
    # header already sent by this upstream, so fixing it only there leaves
    # both values on the wire.
    location ~* ^/(sw|sw-push)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
        access_log off;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
        access_log off;
    }

    # Static assets with long cache (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html — it references the current hashed JS/CSS
    # filenames, so a stale cached copy here permanently locks users into
    # an old build even after we deploy fixes. Force revalidation every time.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Uploads served by API (QR codes, profile images, etc.)
    # ^~ is required here: without it, nginx's regex location above
    # (location ~* \.(js|css|png|...)$) matches *.png files first and
    # wins regardless of declaration order, sending QR code/upload
    # requests to try_files on this frontend container — where they
    # don't exist — instead of proxying to the API container where the
    # files actually live. ^~ tells nginx to stop at this prefix match
    # and skip the regex check entirely once /uploads/ matches.
    location ^~ /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
