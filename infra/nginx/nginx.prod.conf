# Vitar v5 — Production Nginx for livevault.cloud
# No subdomain: frontend + API both on livevault.cloud
# API routes:    https://livevault.cloud/api/...
# Frontend:      https://livevault.cloud/

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path        /tmp/nginx_proxy;
    fastcgi_temp_path      /tmp/nginx_fastcgi;
    uwsgi_temp_path        /tmp/nginx_uwsgi;
    scgi_temp_path         /tmp/nginx_scgi;

    # Performance
    sendfile              on;
    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     75;
    keepalive_requests    1000;
    reset_timedout_connection on;
    client_body_timeout   30s;
    send_timeout          30s;

    # Compression
    gzip            on;
    gzip_min_length 1000;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # Security
    server_tokens off;

    # ── Cloudflare real-IP recovery ─────────────────────────────────────
    # Without this, every request appears to originate from Cloudflare's
    # edge IPs once Cloudflare is placed in front — which breaks the
    # per-visitor rate-limit zones below (they'd rate-limit Cloudflare's
    # IPs, not real users) and pollutes access logs.
    # Generated/refreshed by scripts/update-cloudflare-ips.sh
    include /etc/nginx/cloudflare-ips.conf;

    # ── Rate-limit zones ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:20m     rate=120r/m;
    limit_req_zone $binary_remote_addr zone=booking:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m      rate=10r/m;

    # ── Upstream resolution ─────────────────────────────────────────────
    # Docker's embedded DNS (127.0.0.11) re-resolves service names on this
    # TTL. The `upstream { server api:8000; }` form used previously resolves
    # once at nginx startup and never again — when the `api` container is
    # recreated (rebuild/restart/scale), it gets a new internal IP and nginx
    # keeps hitting the dead one until something forces re-resolution, which
    # is what `docker compose restart nginx` was doing manually every time.
    # Using a variable in proxy_pass instead forces nginx to consult this
    # resolver on every request (cached per `valid`), and still works
    # correctly with `docker compose scale api=3` — the service name still
    # round-robins across replica IPs, just re-resolved periodically instead
    # of once.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────
    server {
        listen 80;
        server_name livevault.cloud www.livevault.cloud;

        # Let's Encrypt ACME challenge (certbot writes here)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://livevault.cloud$request_uri;
        }
    }

    # ── www → non-www redirect (HTTPS) ──────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name www.livevault.cloud;

        ssl_certificate     /etc/letsencrypt/live/livevault.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/livevault.cloud/privkey.pem;

        return 301 https://livevault.cloud$request_uri;
    }

    # ── Main HTTPS server ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name livevault.cloud;

        client_max_body_size 10M;

        set $api_upstream api:8000;
        set $frontend_upstream frontend:80;
        set $grafana_upstream grafana:3000;

        # SSL (issued by certbot / Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/livevault.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/livevault.cloud/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Auth endpoints — strict rate limit
        location ~* ^/api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass         http://$api_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # AI endpoints — expensive, rate limited
        location ~* ^/api/v1/ai/ {
            limit_req zone=ai burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://$api_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 45s;
        }

        # Public booking pages
        location ~* ^/api/v1/booking/ {
            limit_req zone=booking burst=15 nodelay;
            limit_req_status 429;
            proxy_pass         http://$api_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Webhooks — no rate limit (Paystack/Stripe fire fast)
        location ~* ^/api/v1/webhooks/ {
            proxy_pass         http://$api_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 30s;
        }

        # Metrics — internal only (Prometheus scrapes from docker network, not public)
        location = /metrics {
            allow 172.16.0.0/12;    # Docker internal networks
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass         http://$api_upstream;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # Grafana — internal dashboards (access via SSH tunnel or VPN)
        location /grafana/ {
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass         http://$grafana_upstream/grafana/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Health check — no rate limit, no access log
        location = /health {
            proxy_pass       http://$api_upstream;
            proxy_set_header Host $host;
            access_log       off;
        }

        location ~ ^/health/(live|ready)$ {
            proxy_pass       http://$api_upstream;
            proxy_set_header Host $host;
            access_log       off;
        }

        # All other API routes
        location ~* ^/api/ {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass         http://$api_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 60s;
        }

        # Static assets — long cache
        location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff|woff2|ttf|webp)$ {
            proxy_pass       http://$frontend_upstream;
            proxy_set_header Host $host;
            expires          1y;
            add_header       Cache-Control "public, immutable";
            access_log       off;
        }

        # Frontend SPA — all remaining routes
        location / {
            proxy_pass         http://$frontend_upstream;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
