# ─── Vitar — Production Compose (Oracle Cloud Free Tier) ─────────────────────
#
# Runs on a single Oracle Cloud Ampere ARM VM (4 CPU / 24GB RAM — always free).
# Postgres is Supabase. Everything else runs on the VM.
#
# Usage on the server:
#   docker compose -f docker-compose.prod-free.yml up -d --build
#
# First deploy (run migrations once, then start):
#   docker compose -f docker-compose.prod-free.yml run --rm api alembic upgrade head
#   docker compose -f docker-compose.prod-free.yml up -d
#
# What's removed vs the original docker-compose.yml:
#   - postgres (replaced by Supabase)
#   - worker_dead_letter (merged into main worker to save RAM)
#   - frontend (built as static files, served by nginx directly from dist/)
#   - prometheus, grafana, alertmanager, redis_exporter, postgres_exporter,
#     node-exporter (observability profile — skip until you can afford it)
#   - postgres-replica (replica profile)
# ─────────────────────────────────────────────────────────────────────────────

x-api-env: &api-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://postgres:${SUPABASE_DB_PASSWORD}@pgbouncer:5432/postgres
    MIGRATION_DATABASE_URL: ${SUPABASE_DB_URL}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    ENVIRONMENT: production
    DEBUG: "false"

# RELIABILITY: Docker's default json-file log driver has no size cap — on a
# long-running unattended single VM, logs grow forever until the disk fills.
# A full disk takes down Postgres/Redis writes and Docker itself, not just
# this app — exactly the slow, unattended failure mode this compose file
# otherwise guards against with restart policies and health checks. Capped
# and rotated (10MB × 3 files = 30MB max per container) here instead.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── Redis ─────────────────────────────────────────────────────────────────
  # SECURITY/RELIABILITY: this one instance is shared by REDIS_URL (db0 —
  # cache, rate limiting, idempotency), CELERY_BROKER_URL (db1 — the actual
  # task queue), and CELERY_RESULT_BACKEND (db2). maxmemory-policy is
  # instance-wide, not per-db. `allkeys-lru` would silently evict whichever
  # keys are least-recently-used once memory hits the cap — including queued
  # Celery messages sitting in the broker's list. An evicted task vanishes
  # with no error, no log, no dead-letter entry (it's gone before a worker
  # ever picks it up to fail), which over weeks of runtime under real load
  # means reminders/push-notifications/payment-retries silently stop firing
  # with nothing pointing at why. `noeviction` makes Redis reject writes
  # loudly once full instead — every write path here (app/core/cache.py,
  # the Celery producer calls in *_dispatch_* helpers) already wraps Redis
  # calls in try/except and fails open with a logged error, so a full-instance
  # OOM becomes a visible log line instead of silent data loss.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --maxmemory 200mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── PgBouncer — pools connections to Supabase ─────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    <<: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    environment:
      DB_HOST: ${SUPABASE_DB_HOST}
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "15"
      MIN_POOL_SIZE: "3"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_IDLE_TIMEOUT: "600"
      AUTH_TYPE: md5
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,lock_timeout,statement_timeout,idle_in_transaction_session_timeout,search_path,application_name,options
      SERVER_TLS_SSLMODE: require
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # NOTE: a mapping can only have one `<<:` merge key — combine both
    # anchors into a single list-merge instead of two separate `<<:` entries
    # (two would be a duplicate key; parsers differ on whether that errors
    # or silently drops one, so don't risk it).
    <<: [*api-env, *default-logging]
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      DATABASE_URL: postgresql://postgres:${SUPABASE_DB_PASSWORD}@pgbouncer:5432/postgres
      MIGRATION_DATABASE_URL: ${SUPABASE_DB_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
      DEBUG: "false"
      UVICORN_WORKERS: "2"
      LOG_LEVEL: "info"
      SKIP_MIGRATIONS: "true"
      STORAGE_BACKEND: local
      ALLOW_LOCAL_UPLOADS_IN_PRODUCTION: "true"
      # SECURITY: main.py gates /api/v1/docs + /api/v1/openapi.json with
      # `API_DOCS_ENABLED or ENVIRONMENT != "production"` — this compose
      # environment block overrides .env (env_file loses to explicit
      # `environment:` entries), so "true" here was publishing the full API
      # schema (every endpoint, including admin/Wabizz routes) regardless of
      # ENVIRONMENT=production above it or whatever .env/.env.example say.
      API_DOCS_ENABLED: "false"
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: https://${DOMAIN}
      ALLOWED_ORIGINS: '["https://${DOMAIN}","https://www.${DOMAIN}","https://app.${DOMAIN}","https://api.${DOMAIN}"]'
      ALLOWED_HOSTS: '["${DOMAIN}","www.${DOMAIN}","app.${DOMAIN}","api.${DOMAIN}"]'
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── Celery worker (handles all queues including dead_letter) ──────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: always
    deploy:
      resources:
        limits:
          # Bumped alongside --concurrency=1→2 below: default Celery pool is
          # prefork, so concurrency=2 forks a second full worker child
          # process. 320M was sized for exactly one process; without more
          # headroom here the container risks an OOM-kill under load instead
          # of gaining the throughput this bump is meant to add. CPU raised
          # to match — 0.5 was already the ceiling for one busy process, a
          # second one needs its own share. Host is a 4 OCPU / 24GB Oracle
          # free-tier VM; every service's *limit* here still sums well under
          # that, so there's room.
          cpus: '0.75'
          memory: 480M
        reservations:
          cpus: '0.25'
          memory: 144M
    <<: [*api-env, *default-logging]
    environment:
      DATABASE_URL: postgresql://postgres:${SUPABASE_DB_PASSWORD}@pgbouncer:5432/postgres
      MIGRATION_DATABASE_URL: ${SUPABASE_DB_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
      CELERY_WORKER_HOSTNAME: "worker@%h"
      OPS_MONITORING_ENABLED: "false"
    # All queues merged into one worker to save RAM on the free VM.
    # concurrency=2 (was 1): the single-process worker was the real ceiling
    # on background-job throughput under concurrent load — every reminder
    # send, push notification, no-show risk score, and billing retry funnels
    # through this one process across all 6 queues. Two workers roughly
    # doubles throughput without the RAM cost of going straight to 3+.
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --queues=notifications,reminders,ai,billing,celery,dead_letter
      --concurrency=2
      --max-tasks-per-child=500
      --hostname=worker@%h
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker@$$HOSTNAME --timeout 15 2>&1 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s

  # ── Celery Beat scheduler ──────────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    <<: [*api-env, *default-logging]
    environment:
      DATABASE_URL: postgresql://postgres:${SUPABASE_DB_PASSWORD}@pgbouncer:5432/postgres
      MIGRATION_DATABASE_URL: ${SUPABASE_DB_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --schedule=/var/celery/celerybeat-schedule
    volumes:
      - celerybeat_data:/var/celery
    depends_on:
      redis:
        condition: service_healthy

  # ── Flower — Celery monitoring UI ─────────────────────────────────────────
  # Disabled by default on the 1-slice pilot tier to save ~128MB RAM.
  # Re-enable once you've upgraded slices:  docker compose --profile monitoring up -d
  # Access at: https://yourdomain.com/flower (behind nginx basic auth)
  flower:
    profiles: ["monitoring"]
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    <<: [*api-env, *default-logging]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: >
      celery -A app.workers.celery_app flower
      --port=5555
      --address=0.0.0.0
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}
      --url_prefix=flower
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5555/flower/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  # Serves: static frontend dist/, /api/ → FastAPI, /flower → Flower, /uploads/
  # SSL is handled by Certbot (run init-ssl.sh after first deploy)
  nginx:
    image: nginx:alpine
    restart: always
    <<: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod-free.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads:/app/uploads:ro
      - ./infra/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./infra/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  uploads:
  celerybeat_data:
