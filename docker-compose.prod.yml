services:
  api:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      # Explicit here (not just inherited default) so production never silently
      # runs on 1 worker. Match this to your VPS's vCPU count — 4 for the
      # recommended 4-slice InterServer plan.
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"
      FRONTEND_URL: https://livevault.cloud
      VITE_API_URL: https://livevault.cloud/api/v1
      ALLOWED_ORIGINS: '["https://livevault.cloud","https://www.livevault.cloud"]'
      # localhost/127.0.0.1 must stay in this list — Docker's own healthcheck
      # (docker-compose.yml api service) hits http://localhost:8000/health/ready
      # directly, bypassing nginx, and TrustedHostMiddleware rejects that Host
      # header otherwise ("Invalid host header"), which Docker reports as the
      # container being unhealthy even though it booted fine. Same reasoning
      # for "api": the Telegram bot (Phase 7) calls http://api:8000/... over
      # the internal docker network, also bypassing nginx.
      ALLOWED_HOSTS: '["localhost","127.0.0.1","api","livevault.cloud","www.livevault.cloud"]'
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      SKIP_MIGRATIONS: "false"

  worker:
    environment:
      ENVIRONMENT: production
      OPS_MONITORING_ENABLED: "true"

  worker_dead_letter:
    environment:
      ENVIRONMENT: production
      OPS_MONITORING_ENABLED: "true"

  beat:
    environment:
      ENVIRONMENT: production
      OPS_MONITORING_ENABLED: "true"

  telegram_bot:
    environment:
      ENVIRONMENT: production

  frontend:
    build:
      args:
        VITE_API_URL: https://livevault.cloud/api/v1

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./infra/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./infra/nginx/certbot/www:/var/www/certbot:ro

  postgres:
    ports: []

  redis:
    ports: []
